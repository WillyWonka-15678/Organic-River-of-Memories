<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · 时光弹幕河</title><link rel="stylesheet" href="/admin/admin.css"><script defer src="/admin/login.js"></script></head><body><main class="login"><h1>时光弹幕河 · 管理员登录</h1><p class="muted">使用本机初始化时创建的管理员账户。</p><form id="login" class="login"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" maxlength="40" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">登录</button></form><p id="error" role="status" aria-live="polite"></p><small>首次使用请在电脑终端运行 npm.cmd run admin:init。会话将在八小时后过期。</small></main></body></html>
